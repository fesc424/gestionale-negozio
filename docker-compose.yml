services:
  postgres:
    image: postgres:16
    container_name: gestionale-db
    environment:
      POSTGRES_DB: gestionale
      POSTGRES_USER: gestionale_user
      POSTGRES_PASSWORD: gestionale_pass
    ports:
      - "5432:5432"
    volumes:
      - gestionale_data:/var/lib/postgresql/data

volumes:
  gestionale_data: